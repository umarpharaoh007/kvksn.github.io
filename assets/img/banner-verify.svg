  <text x="72" y="288" font-family="'Segoe UI',Arial,sans-serif" font-size="20" fill="#CFE0DC">Verification is the final step in completing your filing.</text>
  <text x="72" y="316" font-family="'Segoe UI',Arial,sans-serif" font-size="20" fill="#CFE0DC">Verify within 30 days and stay compliant.</text>

  <rect x="72" y="330" width="340" height="54" rx="3" fill="#ffffff" opacity="0.10"/>
  <text x="92" y="365" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="23"
