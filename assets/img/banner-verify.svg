<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 460" role="img" aria-label="E-VERIFICATION">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C3A4E"/><stop offset="100%" stop-color="#12706B"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1250" height="460" fill="url(#bg)"/>
  <path d="M700 0 C 830 150, 700 300, 900 460 L1250 460 L1250 0 Z" fill="#ffffff" opacity="0.045"/>
  <path d="M840 0 C 960 160, 830 320, 1030 460 L1250 460 L1250 0 Z" fill="url(#sheen)"/>
  <path d="M0 418 C 320 472, 930 362, 1250 422 L1250 460 L0 460 Z" fill="#FCFBF6"/>

  
  <g transform="translate(960,118)">
    <circle cx="108" cy="108" r="102" fill="none" stroke="#7FE3B0" stroke-width="3" opacity="0.30"/>
    <circle cx="108" cy="108" r="82" fill="none" stroke="#7FE3B0" stroke-width="2" opacity="0.50"/>
