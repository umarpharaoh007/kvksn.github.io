  <line x1="72" y1="112" x2="150" y2="112" stroke="#F5B33C" stroke-width="4"/>
  <text x="72" y="100" font-family="'Consolas','IBM Plex Mono',monospace" font-size="17"
        letter-spacing="5" fill="#F5B33C">E-VERIFICATION</text>
  <text x="72" y="180" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="52"
