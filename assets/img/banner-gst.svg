<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 460" role="img" aria-label="GST COMPLIANCE">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2438"/><stop offset="100%" stop-color="#1D5C55"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1250" height="460" fill="url(#bg)"/>
  <path d="M700 0 C 830 150, 700 300, 900 460 L1250 460 L1250 0 Z" fill="#ffffff" opacity="0.045"/>
  <path d="M840 0 C 960 160, 830 320, 1030 460 L1250 460 L1250 0 Z" fill="url(#sheen)"/>
  <path d="M0 418 C 320 472, 930 362, 1250 422 L1250 460 L0 460 Z" fill="#FCFBF6"/>

  
  <g transform="translate(935,112)">
    <rect x="10" y="24" width="234" height="196" rx="12" fill="#0B2E4F" opacity="0.5"/>
    <rect x="0" y="12" width="234" height="196" rx="12" fill="#F4F8FB"/>
    <rect x="0" y="12" width="234" height="44" rx="12" fill="#1E6B45"/>
    <rect x="0" y="44" width="234" height="12" fill="#1E6B45"/>
    <text x="117" y="42" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif"
          font-weight="700" font-size="20" letter-spacing="3" fill="#FFFFFF">GST RETURNS</text>
    <g font-family="'Consolas',monospace" font-size="15" fill="#3E5568">
      <text x="24" y="92">GSTR-1</text>   <text x="210" y="92" text-anchor="end" fill="#12A05C">&#10003;</text>
      <text x="24" y="126">GSTR-3B</text> <text x="210" y="126" text-anchor="end" fill="#12A05C">&#10003;</text>
      <text x="24" y="160">GSTR-9</text>  <text x="210" y="160" text-anchor="end" fill="#12A05C">&#10003;</text>
      <text x="24" y="194">CMP-08</text>  <text x="210" y="194" text-anchor="end" fill="#12A05C">&#10003;</text>
    </g>
    <line x1="24" y1="104" x2="210" y2="104" stroke="#E1E7EC" stroke-width="1.5"/>
    <line x1="24" y1="138" x2="210" y2="138" stroke="#E1E7EC" stroke-width="1.5"/>
    <line x1="24" y1="172" x2="210" y2="172" stroke="#E1E7EC" stroke-width="1.5"/>
  </g>

  <line x1="72" y1="112" x2="150" y2="112" stroke="#F5B33C" stroke-width="4"/>
  <text x="72" y="100" font-family="'Consolas','IBM Plex Mono',monospace" font-size="17"
        letter-spacing="5" fill="#F5B33C">GST COMPLIANCE</text>
  <text x="72" y="180" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="52"
        fill="#FFFFFF">Every return filed,</text>
  <text x="72" y="240" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="52"
        fill="#FFFFFF">every single month.</text>
  <text x="72" y="288" font-family="'Segoe UI',Arial,sans-serif" font-size="20" fill="#CFE0DC">GSTR-1, 3B, annual return and reconciliation &#8212;</text>
  <text x="72" y="316" font-family="'Segoe UI',Arial,sans-serif" font-size="20" fill="#CFE0DC">prepared, filed and acknowledged on time.</text>

  <rect x="72" y="330" width="340" height="54" rx="3" fill="#ffffff" opacity="0.10"/>
  <text x="92" y="365" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="23"
        fill="#FFFFFF">KVKSN <tspan fill="#F5B33C">&amp;</tspan> CO.</text>
  <text x="278" y="353" font-family="'Consolas',monospace" font-size="10.5" letter-spacing="2.2"
        fill="#A9BEBA">CHARTERED</text>
  <text x="278" y="370" font-family="'Consolas',monospace" font-size="10.5" letter-spacing="2.2"
        fill="#A9BEBA">ACCOUNTANTS</text>
</svg>
